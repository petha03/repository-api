spring.application.name=developerRepository-api

# Disable SSL for integration tests
server.ssl.enabled=false
server.port=8080

# Rate Limit Configuration - Configured for integration tests
# Health endpoint: 1 request per 5 minutes (matches production for rate limit testing)
rate-limit.health.capacity=1
rate-limit.health.refillTokens=1
rate-limit.health.refillPeriod=5
rate-limit.health.refillUnit=MINUTES

# Developer endpoint: 10 requests per minute (matches production for realistic testing)
rate-limit.developer.capacity=10
rate-limit.developer.refillTokens=10
rate-limit.developer.refillPeriod=1
rate-limit.developer.refillUnit=MINUTES

# Cache Configuration - Short TTL for integration tests
cache.github.ttl-minutes=1
cache.github.max-size=50

# Logging Configuration - Info level for integration tests
logging.level.com.branch.repository.api=INFO
logging.level.com.branch.repository.api.infrastructure.cache=DEBUG
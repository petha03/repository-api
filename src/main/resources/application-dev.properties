# Development Profile Configuration
# This profile is for local development with relaxed rate limits and verbose logging

# Rate Limit Configuration - More relaxed for development
# Health endpoint: 10 requests per minute (allows frequent health checks during development)
rate-limit.health.capacity=10
rate-limit.health.refillTokens=10
rate-limit.health.refillPeriod=1
rate-limit.health.refillUnit=MINUTES

# Developer endpoint: 30 requests per minute (allows rapid testing)
rate-limit.developer.capacity=30
rate-limit.developer.refillTokens=30
rate-limit.developer.refillPeriod=1
rate-limit.developer.refillUnit=MINUTES

# Cache Configuration - Shorter TTL for development to see changes faster
cache.github.ttl-minutes=5
cache.github.max-size=100

# Logging Configuration - More verbose for development
logging.level.com.branch.repository.api=DEBUG
logging.level.com.branch.repository.api.infrastructure.cache=DEBUG
logging.level.com.branch.repository.api.infrastructure.ratelimit=DEBUG
logging.level.org.springframework.web=DEBUG
# Production Profile Configuration
# This profile is for production with stricter rate limits and optimized settings

# Rate Limit Configuration - Stricter for production to prevent abuse
# Health endpoint: 1 request per 5 minutes (sufficient for health checks)
rate-limit.health.capacity=1
rate-limit.health.refillTokens=1
rate-limit.health.refillPeriod=5
rate-limit.health.refillUnit=MINUTES

# Developer endpoint: 5 requests per minute (conservative limit for production)
rate-limit.developer.capacity=5
rate-limit.developer.refillTokens=5
rate-limit.developer.refillPeriod=1
rate-limit.developer.refillUnit=MINUTES

# Cache Configuration - Longer TTL for production to reduce GitHub API calls
cache.github.ttl-minutes=120
cache.github.max-size=5000

# Logging Configuration - Less verbose for production
logging.level.com.branch.repository.api=INFO
logging.level.com.branch.repository.api.infrastructure.cache=WARN
logging.level.com.branch.repository.api.infrastructure.ratelimit=WARN
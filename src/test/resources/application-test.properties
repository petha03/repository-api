spring.application.name=developerRepository-api

# Disable SSL for tests
server.ssl.enabled=false
server.port=8080

# Rate Limit Configuration - Moderate for unit tests
# Health endpoint: 100 requests per minute (prevents test failures)
rate-limit.health.capacity=100
rate-limit.health.refillTokens=100
rate-limit.health.refillPeriod=1
rate-limit.health.refillUnit=MINUTES

# Developer endpoint: 100 requests per minute (prevents test failures)
rate-limit.developer.capacity=100
rate-limit.developer.refillTokens=100
rate-limit.developer.refillPeriod=1
rate-limit.developer.refillUnit=MINUTES

# Cache Configuration - Disabled for unit tests to ensure test isolation
cache.github.ttl-minutes=0
cache.github.max-size=10

# Logging Configuration - Minimal for unit tests
logging.level.com.branch.repository.api=WARN